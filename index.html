<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Set the theme before first paint, or a light-mode visitor gets a
      // full-screen flash of near-black on every load.
      (function () {
        try {
          var stored = localStorage.getItem('miclab.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <meta
      name="description"
      content="Build a condenser microphone stage by stage from real components, hear it, and see why it sounds the way it does."
    />
    <title>Mic Lab — virtual condenser mic builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
